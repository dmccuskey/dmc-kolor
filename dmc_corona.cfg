[DMC_CORONA]

--==================================================--
-- option LUA_PATH, json
--
-- The folders which hold the DMC libraries, relative to
-- the project root. See dmc-corona-boot's documentation:
-- https://github.com/dmccuskey/dmc-corona-boot/blob/master/docs/configuration.md

LUA_PATH:JSON = [ "./dmc_corona" ]



[DMC_KOLOR]

--==================================================--
-- option DEFAULT_COLOR_FORMAT, string
--
-- The format of the colors given to Kolor.translateColor():
--
--   dRGBA   decimal RGB and alpha, 0-1, eg ( 1, 0.7, 0.13, 0.5 )
--   hRGBA   integer RGB and alpha, 0-255, eg ( 255, 180, 34, 128 )
--   hRGBdA  integer RGB, 0-255, decimal alpha, 0-1, eg ( 255, 180, 34, 0.5 )
--
-- Default is dRGBA, the format Solar2D uses.

-- DEFAULT_COLOR_FORMAT = hRGBA


--==================================================--
-- option NAMED_COLOR_FILE, string
--
-- A named-color file to load at startup, as a Lua module name.
-- dmc-kolor comes with the X11 colors in dmc_kolor.named_colors_hex
-- (dmc_kolor.named_colors_rgb and _hdr are deprecated names for it).
--
-- No default: no named colors are loaded.

-- NAMED_COLOR_FILE = dmc_kolor.named_colors_hex
